api_version = "2026-07"

[[extensions]]
name = "Pincode checkout validation"
handle = "checkout-pincode-validation"
type = "ui_extension"
uid = "344b3194-1263-4af6-6671-9307f8bcdc70314abc8a"
description = "Validates shipping pincode against cart attributes and allowed pincode sheet"

[[extensions.targeting]]
module = "./src/Checkout.jsx"
target = "purchase.checkout.block.render"

[extensions.capabilities]
network_access = true
api_access = true
block_progress = true

[extensions.settings]
[[extensions.settings.fields]]
key = "default_pincode_sheet_url"
type = "single_line_text_field"
name = "Default pincode CSV URL"
description = "One multi-column CSV CDN URL (e.g. appliances_pincode, room-heater_pincode). Checkout checks ZIP against every gated line column."
